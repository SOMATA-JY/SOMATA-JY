<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-label="SOMATA workflow: geometry, cells, nutrient, phenotype, spread, therapy">
<title>SOMATA workflow</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1530"/></linearGradient>
<linearGradient id="line" gradientUnits="userSpaceOnUse" x1="110.0" y1="92" x2="1170.0" y2="92"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
<style>@keyframes flow { to { stroke-dashoffset: -240; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
.flow { stroke-dasharray: 2 6; animation: flow 60s linear infinite; }
.flow.rev { animation-direction: reverse; animation-duration: 80s; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
.tw { animation: twinkle 3.2s ease-in-out infinite; }
.t1 { animation-delay: -.5s; } .t2 { animation-delay: -1.1s; } .t3 { animation-delay: -1.7s; } .t4 { animation-delay: -2.3s; } .t5 { animation-delay: -2.8s; }
.glow { animation: breathe 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .dash { stroke-dasharray: 4 8; animation: flow 18s linear infinite; }</style>
<rect width="1280" height="230" rx="14" fill="url(#bg)"/>
<line x1="110.0" y1="92" x2="1170.0" y2="92" stroke="url(#line)" stroke-width="2" opacity=".35"/>
<line class="dash" x1="110.0" y1="92" x2="1170.0" y2="92" stroke="url(#line)" stroke-width="2"/>
<g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" text-anchor="middle"><circle class="glow" cx="110.0" cy="92" r="24" fill="#2dd4bf" filter="url(#soft)"/>
<circle class="pulse" cx="110.0" cy="92" r="19" fill="#2dd4bf"/>
<text x="110.0" y="97" font-size="14" font-weight="700" fill="#060912">01</text><text x="110.0" y="142" font-size="13" letter-spacing="3" font-weight="700" fill="#e2e8f0">GEOMETRY</text>
<text x="110.0" y="164" font-size="13" fill="#94a3b8">Real-organ domains</text>
<text x="110.0" y="186" font-size="12" fill="#2dd4bf" font-style="normal" opacity="1">organ-sdf-toolkit</text><circle cx="322.0" cy="92" r="19" fill="#060912" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="3 4"/>
<text x="322.0" y="97" font-size="14" font-weight="700" fill="#2dd4bf">02</text><text x="322.0" y="142" font-size="13" letter-spacing="3" font-weight="700" fill="#e2e8f0">CELLS</text>
<text x="322.0" y="164" font-size="13" fill="#94a3b8">Individual-cell mechanics</text>
<text x="322.0" y="186" font-size="12" fill="#94a3b8" font-style="italic" opacity="0.7">in preparation</text><circle cx="534.0" cy="92" r="19" fill="#060912" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="3 4"/>
<text x="534.0" y="97" font-size="14" font-weight="700" fill="#2dd4bf">03</text><text x="534.0" y="142" font-size="13" letter-spacing="3" font-weight="700" fill="#e2e8f0">NUTRIENT</text>
<text x="534.0" y="164" font-size="13" fill="#94a3b8">Supply–consumption field</text>
<text x="534.0" y="186" font-size="12" fill="#94a3b8" font-style="italic" opacity="0.7">in preparation</text><circle cx="746.0" cy="92" r="19" fill="#060912" stroke="#f472b6" stroke-width="2" stroke-dasharray="3 4"/>
<text x="746.0" y="97" font-size="14" font-weight="700" fill="#f472b6">04</text><text x="746.0" y="142" font-size="13" letter-spacing="3" font-weight="700" fill="#e2e8f0">PHENOTYPE</text>
<text x="746.0" y="164" font-size="13" fill="#94a3b8">P / Q / N layers</text>
<text x="746.0" y="186" font-size="12" fill="#94a3b8" font-style="italic" opacity="0.7">in preparation</text><circle cx="958.0" cy="92" r="19" fill="#060912" stroke="#f472b6" stroke-width="2" stroke-dasharray="3 4"/>
<text x="958.0" y="97" font-size="14" font-weight="700" fill="#f472b6">05</text><text x="958.0" y="142" font-size="13" letter-spacing="3" font-weight="700" fill="#e2e8f0">SPREAD</text>
<text x="958.0" y="164" font-size="13" fill="#94a3b8">Metastasis &amp; colonisation</text>
<text x="958.0" y="186" font-size="12" fill="#94a3b8" font-style="italic" opacity="0.7">in preparation</text><circle cx="1170.0" cy="92" r="19" fill="#060912" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 4"/>
<text x="1170.0" y="97" font-size="14" font-weight="700" fill="#fbbf24">06</text><text x="1170.0" y="142" font-size="13" letter-spacing="3" font-weight="700" fill="#e2e8f0">THERAPY</text>
<text x="1170.0" y="164" font-size="13" fill="#94a3b8">Treatment response</text>
<text x="1170.0" y="186" font-size="12" fill="#94a3b8" font-style="italic" opacity="0.7">in preparation</text></g>
</svg>